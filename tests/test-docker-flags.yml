name: Test docker-flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compose-file: ${{ github.workspace }}/actions/hardened/hoverkraft-tech--compose-action/v3.0.0/tests/fixtures/docker-compose.yml
          docker-flags: "--log-level info"
          up-flags: "--detach --wait --wait-timeout 30"
          down-flags: "--volumes"
      - name: Assert action completed successfully with docker-flags
        run: |
          echo "Action completed with docker-flags '--log-level info' without error"
          echo "PASS"
