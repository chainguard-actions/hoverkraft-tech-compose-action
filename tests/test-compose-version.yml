name: Test compose-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Docker Compose Action with compose-version latest
        id: action
        uses: .
        with:
          compose-file: "${{ github.workspace }}/tests/fixtures/docker-compose.yml"
          up-flags: "--detach --wait"
          compose-version: "latest"

      - name: Assert service is running after compose-version install
        run: |
          RUNNING=$(docker compose -f "$GITHUB_WORKSPACE/tests/fixtures/docker-compose.yml" ps --services --filter "status=running" 2>/dev/null || true)
          echo "Running services: $RUNNING"
          if ! echo "$RUNNING" | grep -q "service-a"; then
            echo "FAIL: service-a is not running"
            exit 1
          fi
          echo "PASS: service-a is running with latest compose version"
